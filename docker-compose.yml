# Unified entry: Parent Orientation → http://localhost:9080/pmo/  (Technathon → …/technathon/)
#
# Windows: browsers often resolve "localhost" to IPv6 (::1). If http://localhost:9080 fails but
# http://127.0.0.1:9080 works, the gateway publishes both IPv4 and IPv6 below; recreate gateway after edits.
#
# From repository root (this folder):
#   docker compose up --build -d
#
# PMO static UI: `po-frontend` bind-mounts `./frontend/parent-orientation/public` so `app.js` / `index.html`
# changes on the host apply without rebuilding the image (refresh the browser; bump `?v=` in index if cached).
#
# Requires backend/technathon/.env (see env-example/technathon-server.env.example) as the single source
# of truth for Technathon API settings (including MONGO_URI).
#
# PMO (`po-backend`) defaults to NODE_ENV=production. Override for local-only lax mode:
#   create a repo-root `.env` (used by Compose for interpolation only) with:
#     PMO_NODE_ENV=development
#   `backend/parent-orientation/.env` must still satisfy production rules when PMO_NODE_ENV=production
#   (strong COOKIE_SECRET, PMO_PASS/SPEAKER_PASS, MONGODB_URI, etc.).

name: wizklub-gateway

services:
  technathon-mongo:
    image: mongo:7.0-jammy
    restart: unless-stopped
    volumes:
      - wizklub_tech_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - wizklub

  technathon-api:
    build:
      context: ./backend/technathon
      dockerfile: Dockerfile
    restart: unless-stopped
    # Mount .env so Compose does not interpolate `$` in bcrypt hashes (env_file breaks ADMIN_PASSWORD_HASH).
    volumes:
      - ./backend/technathon/.env:/app/.env:ro
      # Logo files are not always baked into older images; mount so WIZKLUB_LOGO_PATH works without rebuild.
      - ./backend/technathon/assets:/app/assets:ro
    environment:
      NODE_ENV: production
      PORT: "5000"
      # nginx sets X-Forwarded-* — needed for express-rate-limit + accurate logs
      TRUST_PROXY: "true"
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:9080/technathon}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:9080}
    depends_on:
      technathon-mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - wizklub

  technathon-web:
    build:
      context: ./frontend/technathon
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_APP_BASE_PATH: /technathon/
    restart: unless-stopped
    depends_on:
      technathon-api:
        condition: service_healthy
    networks:
      - wizklub

  po-mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - wizklub_po_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - wizklub

  po-backend:
    build:
      context: ./backend/parent-orientation
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend/parent-orientation/.env:/app/.env:ro
    environment:
      NODE_ENV: ${PMO_NODE_ENV:-production}
      BIND_HOST: "0.0.0.0"
      # nginx sets X-Forwarded-* — same as Technathon API for correct rate limits / logs
      TRUST_PROXY: "true"
      # MongoDB on compose network: service `po-mongo`, port 27017. Override with PMO_MONGODB_URI when invoking compose.
      MONGODB_URI: ${PMO_MONGODB_URI:-mongodb://po-mongo:27017/}
    depends_on:
      po-mongo:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - wizklub

  po-frontend:
    build:
      context: ./frontend/parent-orientation
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./frontend/parent-orientation/public:/usr/share/nginx/html:ro
      - ./frontend/parent-orientation/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      po-backend:
        condition: service_started
    networks:
      - wizklub

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Explicit v4 + v6 so http://localhost:9080 works when OS prefers ::1 for "localhost"
      - "0.0.0.0:9080:80/tcp"
      - "[::]:9080:80/tcp"
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      technathon-web:
        condition: service_started
      technathon-api:
        condition: service_healthy
      po-frontend:
        condition: service_started
    networks:
      - wizklub

volumes:
  wizklub_tech_mongo:
  wizklub_po_mongo:

networks:
  wizklub:
    driver: bridge
