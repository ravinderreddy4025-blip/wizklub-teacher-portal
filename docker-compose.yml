# Two-container stack:
# - `backend`: runs BOTH APIs (Technathon on :5000, PMO on :8080)
# - `frontend`: serves BOTH UIs (/technathon, /pmo) and proxies API routes
#
# Requires external Mongo hosts (no Mongo containers here).
# Set these in repo-root `.env`:
#   MONGO_URI=...          (shared Mongo host/cluster URI)
#   MONGO_DB_NAME=...      (shared default DB name)
# Optional per-app DB override keys:
#   TECH_MONGO_DB_NAME=...
#   PMO_MONGO_DB_NAME=...

name: wizklub-2c

services:
  backend:
    build:
      context: .
      dockerfile: backend/combined.Dockerfile
    restart: unless-stopped
    environment:
      # Technathon backend
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in .env}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-}
      TECH_MONGO_DB_NAME: ${TECH_MONGO_DB_NAME:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
      STUDENT_FORM_SECRET: ${STUDENT_FORM_SECRET:?Set STUDENT_FORM_SECRET in .env}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:9080}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:9080/technathon}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_UPLOAD_PREFIX: ${S3_UPLOAD_PREFIX:-}
      S3_SIGNED_URL_EXPIRES_SEC: ${S3_SIGNED_URL_EXPIRES_SEC:-}
      SES_REGION: ${SES_REGION:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      AWS_NOTIF_ACCESS_KEY: ${AWS_NOTIF_ACCESS_KEY:-}
      AWS_NOTIF_SECRET_KEY: ${AWS_NOTIF_SECRET_KEY:-}
      SES_STUDENT_SUBMISSION_TEMPLATE_NAME: ${SES_STUDENT_SUBMISSION_TEMPLATE_NAME:-}
      WIZKLUB_LOGO_PATH: ${WIZKLUB_LOGO_PATH:-./assets/email-logo.png}

      # PMO backend
      PMO_NODE_ENV: ${PMO_NODE_ENV:-production}
      PMO_MONGODB_URI: ${PMO_MONGODB_URI:-}
      PMO_MONGO_DB_NAME: ${PMO_MONGO_DB_NAME:-}
      PMO_USER: ${PMO_USER:?Set PMO_USER in .env}
      PMO_PASS: ${PMO_PASS:?Set PMO_PASS in .env}
      SPEAKER_USER: ${SPEAKER_USER:?Set SPEAKER_USER in .env}
      SPEAKER_PASS: ${SPEAKER_PASS:?Set SPEAKER_PASS in .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env}
    volumes:
      - ./backend/technathon/assets:/app/backend/technathon/assets:ro
    expose:
      - "5000"
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http');const req=(u)=>new Promise((res,rej)=>{http.get(u,r=>{r.resume();res(r.statusCode>=200&&r.statusCode<400)}).on('error',rej)});Promise.all([req('http://127.0.0.1:5000/health'),req('http://127.0.0.1:8080/api/health')]).then(v=>process.exit(v.every(Boolean)?0:1)).catch(()=>process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - wizklub

  frontend:
    build:
      context: .
      dockerfile: frontend/combined.Dockerfile
      args:
        VITE_API_URL: ""
        VITE_APP_BASE_PATH: /technathon/
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "0.0.0.0:9080:80/tcp"
      - "[::]:9080:80/tcp"
    networks:
      - wizklub

networks:
  wizklub:
    driver: bridge
