# Local full stack: app + MongoDB. Opens http://localhost:8080
#
#   docker compose up --build
#
# Uses NODE_ENV=development so startup does not require production secrets.
# For production-like runs inside Compose, set env in a .env.docker file (see deploy/docker.md).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - po_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      BIND_HOST: "0.0.0.0"
      PORT: "8080"
      COOKIE_SECRET: "docker-compose-local-dev-32char-secret-change-me"
      PMO_USER: PMO
      PMO_PASS: PMO@123
      SPEAKER_USER: Speaker
      SPEAKER_PASS: Speaker@123
      ADMIN_USER: admin
      MONGODB_URI: mongodb://mongo:27017/
      MONGODB_DB: parent_orientation
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  po_mongo_data:
