# Local full stack: frontend + backend + MongoDB. Opens http://localhost/pmo
#
#   docker compose up --build
#
# Uses NODE_ENV=development so startup does not require production secrets.
# Swagger UI is available by default here; set SWAGGER_UI=0 on backend service to hide /api-docs.
# For production-like runs inside Compose, set env in a .env.docker file
# (template: ../../env-example/parent-orientation/.env.docker.example).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - po_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ../../backend/parent-orientation
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../backend/parent-orientation/.env
    environment:
      NODE_ENV: development
      # Backend container must listen on all interfaces so frontend proxy can reach it.
      BIND_HOST: "0.0.0.0"
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    build:
      context: ../../frontend/parent-orientation
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  po_mongo_data:
