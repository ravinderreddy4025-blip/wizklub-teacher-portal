# Single host: Parent Orientation at http://localhost:9080/pmo/
#               Technathon at http://localhost:9080/technathon/
#
# From this directory:
#   docker compose up --build -d
#
# Requires backend/technathon/.env (see env-example/technathon) as the single source
# of truth for Technathon API settings (including MONGO_URI).

name: wizklub-gateway

services:
  technathon-mongo:
    image: mongo:7.0-jammy
    restart: unless-stopped
    volumes:
      - wizklub_tech_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - wizklub

  technathon-api:
    build:
      context: ../../backend/technathon
      dockerfile: Dockerfile
    restart: unless-stopped
    # Mount .env so Compose does not interpolate `$` in bcrypt hashes (env_file breaks ADMIN_PASSWORD_HASH).
    volumes:
      - ../../backend/technathon/.env:/app/.env:ro
      # Logo files are not always baked into older images; mount so WIZKLUB_LOGO_PATH works without rebuild.
      - ../../backend/technathon/assets:/app/assets:ro
    environment:
      NODE_ENV: production
      PORT: "5000"
      # nginx sets X-Forwarded-* — needed for express-rate-limit + accurate logs
      TRUST_PROXY: "true"
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:9080/technathon}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:9080}
    depends_on:
      technathon-mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - wizklub

  technathon-web:
    build:
      context: ../../frontend/technathon
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_APP_BASE_PATH: /technathon/
    restart: unless-stopped
    depends_on:
      technathon-api:
        condition: service_healthy
    networks:
      - wizklub

  po-mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - wizklub_po_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - wizklub

  po-backend:
    build:
      context: ../../backend/parent-orientation
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ../../backend/parent-orientation/.env:/app/.env:ro
    environment:
      NODE_ENV: development
      BIND_HOST: "0.0.0.0"
    depends_on:
      po-mongo:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - wizklub

  po-frontend:
    build:
      context: ../../frontend/parent-orientation
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      po-backend:
        condition: service_started
    networks:
      - wizklub

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "9080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      technathon-web:
        condition: service_started
      technathon-api:
        condition: service_healthy
      po-frontend:
        condition: service_started
    networks:
      - wizklub

volumes:
  wizklub_tech_mongo:
  wizklub_po_mongo:

networks:
  wizklub:
    driver: bridge
