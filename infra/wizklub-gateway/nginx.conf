# Unified entry: Parent Orientation → /pmo/ , Technathon → /technathon/
# Use Docker embedded DNS + variables so upstream IPs refresh after `docker compose recreate`
# (static upstream blocks cache the first resolved IP → stale IP → 502 Connection refused).

server {
  listen 80;
  server_name _;

  # Default nginx limit is 1m — Technathon video uploads are up to 300 MB (multer); allow headroom.
  client_max_body_size 350m;

  # Docker Engine DNS inside user-defined networks
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header X-Content-Type-Options nosniff always;

  location = / {
    return 302 /pmo/;
  }

  location /technathon/api/ {
    set $tech_api technathon-api;
    rewrite ^/technathon/api/(.*)$ /api/$1 break;
    proxy_pass http://$tech_api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    # Stream large multipart bodies instead of buffering the whole file in nginx RAM twice.
    proxy_request_buffering off;
  }

  location /technathon/ {
    set $tech_web technathon-web;
    rewrite ^/technathon/(.*)$ /$1 break;
    proxy_pass http://$tech_web:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /pmo/ {
    set $po_fe po-frontend;
    proxy_pass http://$po_fe:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /pmo {
    return 302 /pmo/;
  }
}
