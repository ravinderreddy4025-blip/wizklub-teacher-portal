server {
  listen 80;

  # Keep redirects relative so the browser keeps the host port (e.g. :8080), not container :80.
  absolute_redirect off;
  port_in_redirect off;

  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 350m;
  add_header X-Content-Type-Options nosniff always;

  location = / {
    try_files /index.html =404;
  }

  location = /favicon.ico {
    alias /usr/share/nginx/html/brand/logo.png;
  }

  location = /pmo {
    return 302 $scheme://$http_host/pmo/;
  }

  # Legacy manifest paths (icons referenced as /pwa-icon.svg before /pmo scope fix)
  location = /pwa-icon.svg {
    alias /usr/share/nginx/html/pmo/pwa-icon.svg;
  }

  # PMO API routes -> combined backend (PMO app on :8080)
  location /pmo/api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location /pmo/vendor/ {
    proxy_pass http://backend:8080/vendor/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location = /pmo/Parent_Orientation_Tracker.xlsx {
    proxy_pass http://backend:8080/Parent_Orientation_Tracker.xlsx;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location = /pmo/openapi.json {
    proxy_pass http://backend:8080/openapi.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location /pmo/api-docs/ {
    proxy_pass http://backend:8080/api-docs/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location ~ ^/pmo/join/([A-Za-z0-9_-]+)/?$ {
    proxy_pass http://backend:8080/join/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location /pmo/ {
    try_files $uri $uri/ /pmo/index.html;
  }

  # Wizklub Testimonials API routes -> combined backend (port 3001)
  location /wizklub-testimonials/api/ {
    rewrite ^/wizklub-testimonials/api/(.*)$ /api/$1 break;
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    proxy_request_buffering off;
  }

  location /wizklub-testimonials/ {
    try_files $uri $uri/ /wizklub-testimonials/index.html;
  }
}
