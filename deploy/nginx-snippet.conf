# Terminate TLS in nginx; Node listens on 127.0.0.1 only (BIND_HOST=127.0.0.1).
# App .env: TRUST_PROXY=1, COOKIE_SECURE=1, NODE_ENV=production
#
# Uptime monitors: GET /api/health (no cookie; returns JSON { ok, mongo }).

upstream parent_orientation_node {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name orientation.example.org;

    ssl_certificate     /etc/ssl/certs/your-chain.pem;
    ssl_certificate_key /etc/ssl/private/your-key.pem;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 256;

    # Optional: stricter rate limit at edge (app also rate-limits /api)
    # limit_req_zone $binary_remote_addr zone=po_login:10m rate=5r/m;
    # location = /api/login { limit_req zone=po_login burst=10 nodelay; proxy_pass http://parent_orientation_node; ... }

    location /api/health {
        proxy_pass http://parent_orientation_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://parent_orientation_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        client_max_body_size 12m;
    }
}
