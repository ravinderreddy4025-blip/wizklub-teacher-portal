<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f47d31">
  <title>Join online meeting</title>
  <!-- Served at /pmo/join/<id> (and /join/<id> on the backend) — brand assets live one level up. -->
  <link rel="icon" type="image/svg+xml" href="../brand/favicon.svg">
  <link rel="icon" type="image/png" href="../brand/logo.png">
  <!-- Join CSP allows style-src 'self' — shared tokens live next to index.html (../po-tokens.css). -->
  <link rel="stylesheet" href="../po-tokens.css?v=20260922b">
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --red: #b42323;
      --red-light: #fef0f0;
      --font: var(--po-font);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      font-family: var(--font);
      color: var(--text-primary);
      background: var(--wk-band);
      -webkit-font-smoothing: antialiased;
    }

    .skip-link {
      position: absolute;
      left: 12px;
      top: -56px;
      z-index: 10;
      padding: 8px 16px;
      background: var(--wk-navy);
      color: #fff;
      font-weight: 600;
      border-radius: 9999px;
      text-decoration: none;
    }

    .skip-link:focus,
    .skip-link:focus-visible {
      top: 12px;
    }

    /* Brand half */
    .join-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 48px 88px 48px 48px;
      position: relative;
      isolation: isolate;
      color: var(--wk-navy);
      text-align: center;
      background: var(--wk-chrome);
      overflow: hidden;
    }

    /* Faint doodles over the flat orange */
    .join-brand::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: url('../brand/wiz-auth-bg.svg') center / cover no-repeat;
      opacity: 0.35;
      pointer-events: none;
    }

    .join-logo {
      display: block;
      width: 240px;
      max-width: 70%;
      height: auto;
      filter: drop-shadow(0 2px 6px rgba(120, 40, 0, 0.25));
    }

    .join-brand__tagline {
      margin: 8px 0 0;
      font-size: 28px;
      line-height: 40px;
      font-weight: 600;
    }

    /* Panel half */
    .join-panel {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: -40px;
      padding: 48px 32px;
      background: #fff;
      border-radius: 40px 0 0 40px;
    }

    .join-card {
      width: 100%;
      max-width: 440px;
    }

    .join-eyebrow {
      margin: 0 0 4px;
      font-size: 13px;
      line-height: 20px;
      font-weight: 500;
      text-align: center;
      color: var(--wk-orange-text);
    }

    h1 {
      margin: 0;
      font-size: 36px;
      line-height: 54px;
      font-weight: 500;
      text-align: center;
      color: var(--text-primary);
    }

    .join-meta {
      margin: 16px 0 0;
      padding: 16px;
      border-radius: 16px;
      background: #fff7ee;
      font-size: 14px;
      line-height: 22px;
      color: var(--text-secondary);
      text-align: center;
    }

    .join-meta strong {
      display: block;
      font-size: 16px;
      line-height: 24px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .join-err {
      display: flex;
      gap: 10px;
      margin: 20px 0 0;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--red-light);
      color: var(--red);
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 24px;
    }

    /* Floating-label outlined field (48px, r12) */
    .join-field {
      position: relative;
      display: flex;
      align-items: center;
      height: 48px;
      border: 1px solid var(--border-control);
      border-radius: 12px;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .join-field:focus-within {
      border-color: var(--wk-orange-text);
      box-shadow: 0 0 0 1px var(--wk-orange-text);
    }

    .join-field input {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0 16px 0 24px;
      border: 0;
      border-radius: 12px;
      outline: 0;
      background: transparent;
      font-family: inherit;
      font-size: 16px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-primary);
    }

    .join-field input::placeholder {
      color: transparent;
    }

    .join-field input:focus::placeholder {
      color: #9a9c9f;
      letter-spacing: 0.04em;
    }

    .join-field label {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      padding: 0 6px;
      background: #fff;
      color: var(--text-muted);
      font-size: 16px;
      line-height: 20px;
      pointer-events: none;
      transition: all 0.15s ease;
    }

    .join-field input:focus + label,
    .join-field input:not(:placeholder-shown) + label {
      top: 0;
      font-size: 12px;
    }

    .join-field input:focus + label {
      color: var(--wk-orange-text);
    }

    /* 56px tangerine pill, navy text; grey until an ID is entered */
    button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 56px;
      padding: 0 24px;
      border: 0;
      border-radius: 9999px;
      background: var(--wk-orange);
      color: var(--wk-navy);
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--wk-orange-edge);
      transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.1s ease;
    }

    button:hover {
      background: var(--wk-orange-hover);
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--wk-orange-edge);
    }

    #join-form:invalid button {
      background: #e6e7e8;
      color: var(--text-muted);
      box-shadow: none;
    }

    button:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    .join-hint {
      margin: 16px 0 0;
      font-size: 13px;
      line-height: 20px;
      text-align: center;
      color: var(--text-muted);
    }

    @media (max-width: 1023px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      .join-brand {
        min-height: 30vh;
        min-height: 30dvh;
        padding: 32px 24px 64px;
        gap: 8px;
      }

      .join-logo {
        width: 176px;
      }

      .join-brand__tagline {
        font-size: 22px;
        line-height: 32px;
      }

      .join-panel {
        align-items: flex-start;
        margin: -32px 0 0;
        padding: 32px max(16px, env(safe-area-inset-left)) 32px max(16px, env(safe-area-inset-right));
        border-radius: 32px 32px 0 0;
      }

      h1 {
        font-size: 28px;
        line-height: 40px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#student_id">Skip to SCS id</a>
  <section class="join-brand" aria-label="WizKlub Futurz">
    <img class="join-logo" src="../brand/logo-white.png" alt="WIZKLUB Futurz — An Infinity Learn initiative" width="240" height="138" decoding="async" onerror="this.onerror=null;this.src='../brand/logo.png'">
    <p class="join-brand__tagline">Parent Orientation</p>
  </section>
  <main class="join-panel">
    <div class="join-card">
      <p class="join-eyebrow">Online session</p>
      <h1>Enter your SCS id</h1>
      <p class="join-meta"><strong>__BRANCH__</strong>Session date: __DATE__</p>
      __ERROR__
      <form method="post" action="" id="join-form">
        <div class="join-field">
          <input type="text" id="student_id" name="student_id" required maxlength="40" autocomplete="off"
            spellcheck="false" inputmode="text" placeholder="SCS12345">
          <label for="student_id">SCS id</label>
        </div>
        <button type="submit">Continue to meeting</button>
      </form>
      <p class="join-hint">Your ID is stored in uppercase. You will be redirected to the video meeting after submitting.</p>
    </div>
  </main>
  <script>
    (function () {
      var input = document.getElementById('student_id');
      if (!input) return;
      input.addEventListener('input', function () {
        var start = input.selectionStart;
        var end = input.selectionEnd;
        input.value = input.value.toUpperCase().replace(/\s+/g, '');
        if (start != null) input.setSelectionRange(start, end);
      });
      var form = document.getElementById('join-form');
      if (form) {
        form.addEventListener('submit', function () {
          input.value = input.value.trim().toUpperCase();
        });
      }
    })();
  </script>
</body>

</html>
