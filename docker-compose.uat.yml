# UAT overlay — third container is Mongo on the compose network.
# Backend uses mongodb://mongo:27017 (no MONGO_URI in .env).
#
#   docker compose -f docker-compose.yml -f docker-compose.uat.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.uat.yml down
#
# Mongo is internal only (not published). Secrets (JWT, SUPERADMIN_PASS, etc.) still come from `.env`.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - uat_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - wizklub

  backend:
    environment:
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
      # Ignore host/Atlas overrides from `.env` so inventory cannot leak to localhost.
      INVENTORY_MONGODB_URI: ""
      PMO_MONGO_DB_NAME: ${PMO_MONGO_DB_NAME:-parent_orientation}
      TESTIMONIALS_MONGO_DB_NAME: ${TESTIMONIALS_MONGO_DB_NAME:-wizklub_testimonials}
      INVENTORY_MONGO_DB_NAME: ${INVENTORY_MONGO_DB_NAME:-wizklub-inventory}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  uat_mongo_data:
